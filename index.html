<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}</style>
<title>Polybrot</title>
<style>
/* Layout: full-bleed canvas, one floating instrument strip bottom-left. Single dark look by choice. */
:root {
  --bg: #07080c;
  --panel: rgba(14, 16, 24, 0.78);
  --fg: #e4e6ef;
  --muted: #8a8fa6;
  --line: rgba(160, 170, 210, 0.18);
  --accent: #9fb4ff;
  --error: #ff9a8f;
  --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --sans: "Inter Tight", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); overflow: hidden; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none;}
canvas.drag { cursor: grabbing; }
.hud {
  position: fixed; left: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  width: 260px; max-width: calc(100% - 32px); box-sizing: border-box;
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  backdrop-filter: blur(10px); padding: 12px 14px;
  display: flex; flex-direction: column; gap: 10px; font-size: 12px;
}
.hud h1 { margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.04em; overflow-wrap: anywhere; }
.hud h1 span { color: var(--muted); font-weight: 400; font-family: var(--mono); margin-left: 6px; }
.readout { font-family: var(--mono); font-variant-numeric: tabular-nums; color: var(--muted); display: grid; grid-template-columns: auto auto; gap: 2px 12px; }
.readout b { color: var(--fg); font-weight: 400; }
.coord {
  font: inherit; color: var(--fg); background: transparent; width: 12ch;
  border: 0; border-bottom: 1px dashed var(--line); padding: 0;
  font-variant-numeric: tabular-nums;
}
.coord:focus { border-bottom-color: var(--accent); outline: none; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
label { color: var(--muted); display: flex; gap: 8px; align-items: center; }
input[type=range] { accent-color: var(--accent); width: 120px; }
.formula { display: flex; flex-direction: column; gap: 6px; }
.formula label { width: 100%; }
#formula {
  flex: 1; min-width: 0; font: 13px var(--mono); color: var(--fg); background: transparent;
  border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px;
}
#formula[aria-invalid="true"] { border-color: var(--error); }
.ferr { color: var(--error); line-height: 1.4; overflow-wrap: anywhere; }
button {
  font: inherit; color: var(--fg); background: transparent; border: 1px solid var(--line);
  border-radius: 6px; padding: 5px 10px; cursor: pointer;
}
button:hover { border-color: var(--accent); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.keys { color: var(--muted); }
.shot {
  position: fixed; inset: 0; background: rgba(0,0,0,0.82); display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 12px; padding: 16px;
}
.shot img { max-width: min(90vw, 900px); max-height: 75vh; border: 1px solid var(--line); }
.shot p { margin: 0; color: var(--muted); }
.err { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; text-align: center; color: var(--muted); }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;600&family=JetBrains+Mono&display=swap">
</head>
<body>

<canvas id="c"></canvas>

<div class="hud">
  <h1>Polybrot <span id="fx">z ↦ z^2 + c</span></h1>
  <div class="formula">
    <label for="formula">z ↦ <input id="formula" type="text" value="z^2 + c" spellcheck="false" autocomplete="off"></label>
    <div class="ferr" id="ferr" role="alert" hidden></div>
  </div>
  <div class="readout">
    <span>re</span><input id="re" class="coord" type="text" inputmode="decimal" spellcheck="false" value="0">
    <span>im</span><input id="im" class="coord" type="text" inputmode="decimal" spellcheck="false" value="0">
    <span>zoom</span><b id="zm">1×</b>
  </div>
  <div class="row">
    <label for="zoom">zoom <input id="zoom" type="range" min="-1.3" max="6" step="0.01" value="0"></label>
  </div>
  <div class="row">
    <label for="iter">iterations <input id="iter" type="range" min="50" max="1000" step="10" value="200"><b id="iv">200</b></label>
  </div>
  <div class="row">
    <label for="phase">palette <input id="phase" type="color" value="#1a334d"></label>
  </div>
  <div class="row">
    <button id="reset">Reset</button>
    <button id="snap">Snapshot (S)</button>
  </div>
  <div class="keys">Drag or arrows to pan · wheel or pinch to zoom</div>
</div>

<div class="shot" id="shot" hidden>
  <img id="shotImg" alt="Rendered snapshot">
  <p>Right-click or long-press the image to save it.</p>
  <button id="closeShot">Close</button>
</div>
<div class="err" id="err" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/mathjs@15.2.0/lib/browser/math.js"></script>
<script src="formula.js"></script>
<script src="polybrot.js"></script>
</body>
</html>
